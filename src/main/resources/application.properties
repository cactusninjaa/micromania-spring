spring.application.name=micromania

# Valeurs par defaut = base locale lancee par docker-compose.
# En conteneur, docker-compose surcharge via SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:micromania}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:micromania}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
